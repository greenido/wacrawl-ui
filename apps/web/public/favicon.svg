<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WaCrawl">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="trail" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="35%" stop-color="#86efac" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bbf7d0" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Data trail: crawl path through the chart -->
  <path
    d="M108 332 C 168 300, 196 252, 248 236 S 332 188, 392 148"
    fill="none"
    stroke="url(#trail)"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#soft)"
    opacity="0.55"
  />
  <path
    d="M108 332 C 168 300, 196 252, 248 236 S 332 188, 392 148"
    fill="none"
    stroke="#ecfdf5"
    stroke-width="7"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Analytics bars -->
  <rect x="118" y="286" width="72" height="118" rx="22" fill="url(#bar)" opacity="0.72"/>
  <rect x="220" y="228" width="72" height="176" rx="22" fill="url(#bar)" opacity="0.88"/>
  <rect x="322" y="162" width="72" height="242" rx="22" fill="url(#bar)"/>

  <!-- Crawl nodes -->
  <circle cx="154" cy="270" r="16" fill="#ecfdf5"/>
  <circle cx="256" cy="212" r="16" fill="#ecfdf5"/>
  <circle cx="358" cy="146" r="20" fill="#ecfdf5"/>
  <circle cx="358" cy="146" r="10" fill="#16a34a"/>
</svg>
